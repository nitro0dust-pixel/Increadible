name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type-check, lint, build, smoke
    runs-on: ubuntu-latest
    steps:
      # Vendored submodules (features/01-06) are not part of our build, so they are not checked out.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          path: ./
          extra_args: --only-verified

  docker:
    name: Build and probe the Docker image
    runs-on: ubuntu-latest
    needs: [quality, test, security]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nitro0dust-pixel/increadible
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: increadible:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Probe the image (config, HTTP, auth, restart persistence, HEALTHCHECK)
        run: bash scripts/probe-image.sh increadible:ci
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha

  verify-published-image:
    name: Verify the published image (pull by digest)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/nitro0dust-pixel/increadible
      DIGEST: ${{ needs.docker.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The pushed digest must be known
        run: |
          test -n "$DIGEST" || { echo "push step produced no digest"; exit 1; }
          echo "pushed digest: $DIGEST"
      - name: Both tags must resolve to the pushed digest
        run: |
          for tag in latest "sha-${{ github.sha }}"; do
            got=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            echo "$IMAGE:$tag -> $got"
            test "$got" = "$DIGEST" || { echo "tag $tag does not point at the pushed digest"; exit 1; }
          done
      - name: Pull the image by digest from GHCR
        run: docker pull "$IMAGE@$DIGEST"
      - name: Probe the pulled image (config, HTTP, auth, restart persistence, HEALTHCHECK)
        run: bash scripts/probe-image.sh "$IMAGE@$DIGEST"
