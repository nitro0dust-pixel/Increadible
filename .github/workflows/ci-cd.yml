name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type-check, lint, build, smoke
    runs-on: ubuntu-latest
    steps:
      # Vendored submodules (features/01-06) are not part of our build, so they are not checked out.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          path: ./
          extra_args: --only-verified

  docker:
    name: Build and probe the Docker image
    runs-on: ubuntu-latest
    needs: [quality, test, security]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nitro0dust-pixel/increadible
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: increadible:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image and probe it
        run: |
          docker run -d --name inc -p 3000:3000 -e AUTH_TOKEN=ci-token increadible:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/health >/dev/null && break; sleep 1; done
          curl -fs localhost:3000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/metrics)" = 401
          curl -fs -H 'Authorization: Bearer ci-token' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' localhost:3000/mcp | grep -q apply_routing_rules
          docker logs inc
          docker rm -f inc
      - name: A/B data survives a container restart (named volume, non-root)
        run: |
          rpc() { curl -fs -H 'Authorization: Bearer ci-token' -d "$1" localhost:3001/mcp; }
          wait_up() { for i in $(seq 1 30); do curl -fs localhost:3001/health >/dev/null && return 0; sleep 1; done; return 1; }
          docker volume create inc-data
          docker run -d --name inc-a -p 3001:3000 -v inc-data:/data -e AUTH_TOKEN=ci-token increadible:ci
          wait_up
          rpc '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"create_experiment","arguments":{"id":"ci","name":"n","hypothesis":"h","metrics":[{"id":"q","name":"q","type":"c","aggregation":"mean"}],"variants":[{"id":"A","name":"a","config":{}},{"id":"B","name":"b","config":{}}]}}}' | jq -e '.result.isError == false'
          rpc '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"record_metric","arguments":{"experiment_id":"ci","variant_id":"A","metrics":{"q":1}}}}' | jq -e '.result.isError == false'
          docker rm -f inc-a
          docker run -d --name inc-b -p 3001:3000 -v inc-data:/data -e AUTH_TOKEN=ci-token increadible:ci
          wait_up
          rpc '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_experiment_results","arguments":{"experiment_id":"ci"}}}' \
            | jq -r '.result.content[0].text' | jq -e '.statistical_analysis.current_samples == 1'
          docker logs inc-b
          docker rm -f inc-b
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
