name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces the older run of the same pull request, but a push to main is never cancelled: each merge keeps its own run,
  # because that run pushes the image and verifies it by digest, and is the evidence recorded for that commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Type-check, lint, build, smoke
    runs-on: ubuntu-latest
    steps:
      # Vendored submodules (features/01-06) are not part of our build, so they are not checked out.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke
      # The one-click Claude Desktop package, built from this commit, checked, and kept so that it can be downloaded without a build toolchain.
      - run: npm run mcpb
      - run: node scripts/mcpb.js inspect dist/mcpb/increadible-*.mcpb
      - uses: actions/upload-artifact@v7
        with:
          name: increadible-mcpb
          path: dist/mcpb/*.mcpb
          if-no-files-found: error

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Generate the SBOM of the production dependency tree (CycloneDX)
        run: npm sbom --omit=dev --sbom-format cyclonedx --sbom-type application > sbom-npm.cdx.json
      - name: The SBOM must be CycloneDX and list at least one component
        run: |
          node -e "const s = require('./sbom-npm.cdx.json'); if (s.bomFormat !== 'CycloneDX' || !Array.isArray(s.components) || s.components.length < 1) { console.error('invalid SBOM'); process.exit(1); } console.log(s.components.length + ' component(s): ' + s.components.map((c) => c.name + '@' + c.version).join(', '));"
      - name: Keep the SBOM with the run
        uses: actions/upload-artifact@v7
        with:
          name: sbom-npm
          path: sbom-npm.cdx.json
          if-no-files-found: error
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          path: ./
          extra_args: --only-verified
          # The action runs ghcr.io/trufflesecurity/trufflehog:<version>; the default is the moving "latest". Pinned by digest
          # (audit D-5, owner decision 2026-10-09) to the image CI ran on 2026-10-09 (run 37985795436, TruffleHog 3.99.2).
          # Bump on purpose: take the digest from a run's "Digest:" line and update this line and its test.
          version: 3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a

  prometheus:
    name: Prometheus alert rules (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Go and jq come with the runner image. The build is pinned to one Prometheus release and its checksum.
      - name: Build promtool from the pinned, checksum-verified Prometheus release
        run: bash scripts/install-promtool.sh "$RUNNER_TEMP/promtool-bin"
      - name: Check the alert rules and run their unit tests
        run: PROMTOOL="$RUNNER_TEMP/promtool-bin/promtool" bash scripts/check-prometheus.sh

  docker:
    name: Build and probe the Docker image
    runs-on: ubuntu-latest
    needs: [quality, test, security]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nitro0dust-pixel/increadible
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: increadible:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Probe the image (config, HTTP, auth, restart persistence, HEALTHCHECK)
        run: bash scripts/probe-image.sh increadible:ci
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Attach an SBOM (OS packages, Node runtime and npm tree) to the image as an OCI attestation.
          # build-push-action already attaches a provenance attestation by default; do not disable it.
          sbom: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha

  verify-published-image:
    name: Verify the published image (pull by digest)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/nitro0dust-pixel/increadible
      DIGEST: ${{ needs.docker.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The pushed digest must be known
        run: |
          test -n "$DIGEST" || { echo "push step produced no digest"; exit 1; }
          echo "pushed digest: $DIGEST"
      - name: Both tags must resolve to the pushed digest
        run: |
          for tag in latest "sha-${{ github.sha }}"; do
            got=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            echo "$IMAGE:$tag -> $got"
            test "$got" = "$DIGEST" || { echo "tag $tag does not point at the pushed digest"; exit 1; }
          done
      - name: Pull the image by digest from GHCR
        run: docker pull "$IMAGE@$DIGEST"
      - name: Probe the pulled image (config, HTTP, auth, restart persistence, HEALTHCHECK)
        run: bash scripts/probe-image.sh "$IMAGE@$DIGEST"
