apiVersion: v1
kind: Namespace
metadata:
  name: increadible-staging
  labels:
    environment: staging

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: increadible
  namespace: increadible-staging
  labels:
    app: increadible
    environment: staging
    version: 1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: increadible
      environment: staging
  template:
    metadata:
      labels:
        app: increadible
        environment: staging
        version: 1.0.0
    spec:
      serviceAccountName: increadible
      containers:
      - name: increadible
        image: increadible:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        env:
        - name: NODE_ENV
          value: "staging"
        - name: LOG_LEVEL
          value: "debug"
        - name: ENVIRONMENT
          value: "staging"
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: increadible-secrets
              key: anthropic-api-key

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: logs
          mountPath: /app/logs

      volumes:
      - name: config
        configMap:
          name: increadible-config
      - name: logs
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - increadible
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: increadible
  namespace: increadible-staging
  labels:
    app: increadible
    environment: staging
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: increadible
    environment: staging

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: increadible
  namespace: increadible-staging
  labels:
    app: increadible
    environment: staging

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: increadible-config
  namespace: increadible-staging
  labels:
    app: increadible
    environment: staging
data:
  routing-rules.yaml: |
    metadata:
      team: Engineering
      version: 1.0
      environment: staging
    rules:
      - id: simple-tasks
        match: { task_complexity: low }
        provider: claude-haiku
        reason: "Haiku optimal for low-complexity tasks"
      - id: critical-tasks
        match: { priority: critical }
        provider: claude-opus
        reason: "Opus required for critical decisions"
      - id: default
        match: {}
        provider: claude-sonnet
        reason: "Balanced default routing"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: increadible
  namespace: increadible-staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: increadible
      environment: staging
