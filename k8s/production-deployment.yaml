# Increadible on Kubernetes (increadible).
# NOT VERIFIED against a live cluster: these manifests have only been parsed and
# consistency-checked by tests/config.test.ts.
#
# One replica on purpose: A/B experiments and measurements are persisted to a JSONL file on a
# PersistentVolumeClaim (AB_DATA_FILE), which has exactly one writer. More replicas would each
# keep their own in-memory view and a ReadWriteOnce volume cannot be shared. Rule hit counts
# are in memory and reset on restart.
# Rules come from the ConfigMap and are read-only here: edit the ConfigMap and restart the pod
# (the update_rules tool returns an error because the file is read-only).
#
# The image is pulled from GHCR. While that package is private, also create the `ghcr-pull`
# registry secret (see DEPLOYMENT.md); if it does not exist the pod still starts and the pull is
# attempted anonymously, which succeeds only for a public package.
#
# Create the auth secret first (never commit it):
#   kubectl -n increadible create secret generic increadible-secrets \
#     --from-literal=auth-token="$(openssl rand -hex 32)"
apiVersion: v1
kind: Namespace
metadata:
  name: increadible
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: increadible
  namespace: increadible
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: increadible-config
  namespace: increadible
data:
  routing-rules.yaml: |
    metadata:
      team: Engineering
      version: "1.0"
      last_updated: "2026-01-01T00:00:00Z"
    rules:
      - id: critical-tasks
        name: Security & critical analysis
        enabled: true
        priority: 5
        match:
          priority: critical
          task_type: [security, audit]
        provider: claude-opus
        fallback: [gpt-4]
        reason: Opus required for critical decisions
      - id: simple-tasks
        name: Simple questions & summarization
        enabled: true
        priority: 10
        match:
          task_complexity: low
          task_type: [qa, summary]
        provider: claude-haiku
        fallback: [claude-sonnet]
        reason: Haiku is enough for low-complexity tasks
      - id: default
        name: Default rule
        enabled: true
        priority: 100
        match: {}
        provider: claude-sonnet
        reason: Balanced default
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: increadible-data
  namespace: increadible
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: increadible
  namespace: increadible
  labels:
    app: increadible
spec:
  replicas: 1
  selector:
    matchLabels:
      app: increadible
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: increadible
    spec:
      serviceAccountName: increadible
      imagePullSecrets:
        - name: ghcr-pull   # optional: only needed while the GHCR package is private (see DEPLOYMENT.md)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: increadible
          # CI pushes :latest and :sha-<commit>; pin to a sha tag for real rollouts.
          image: ghcr.io/nitro0dust-pixel/increadible:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: RULES_FILE
              value: /config/routing-rules.yaml
            - name: AB_DATA_FILE
              value: /data/ab-data.jsonl
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: increadible-secrets
                  key: auth-token
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: increadible-config
        - name: data
          persistentVolumeClaim:
            claimName: increadible-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: increadible
  namespace: increadible
  labels:
    app: increadible
spec:
  type: ClusterIP
  selector:
    app: increadible
  ports:
    - name: http
      port: 80
      targetPort: http
