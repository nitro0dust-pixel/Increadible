apiVersion: v1
kind: Namespace
metadata:
  name: increadible
  labels:
    environment: production

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: increadible
  namespace: increadible
  labels:
    app: increadible
    environment: production
    version: 1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: increadible
      environment: production
  template:
    metadata:
      labels:
        app: increadible
        environment: production
        version: 1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: increadible
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: increadible
        image: increadible:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP

        env:
        - name: NODE_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "info"
        - name: ENVIRONMENT
          value: "production"
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: increadible-secrets
              key: anthropic-api-key
        - name: OPENWEATHERMAP_API_KEY
          valueFrom:
            secretKeyRef:
              name: increadible-secrets
              key: openweathermap-api-key
              optional: true
        - name: NEWSAPI_KEY
          valueFrom:
            secretKeyRef:
              name: increadible-secrets
              key: newsapi-key
              optional: true

        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache

      volumes:
      - name: config
        configMap:
          name: increadible-config
          defaultMode: 0644
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - increadible
            topologyKey: kubernetes.io/hostname

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: increadible

---
apiVersion: v1
kind: Service
metadata:
  name: increadible
  namespace: increadible
  labels:
    app: increadible
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: https
    port: 443
    targetPort: 3000
    protocol: TCP
  selector:
    app: increadible
    environment: production

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: increadible
  namespace: increadible
  labels:
    app: increadible
    environment: production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: increadible-config
  namespace: increadible
  labels:
    app: increadible
    environment: production
data:
  routing-rules.yaml: |
    metadata:
      team: Engineering
      version: 1.0
      environment: production
    rules:
      - id: simple-tasks
        name: "Simple Questions & Summarization"
        enabled: true
        priority: 10
        match: { task_complexity: low, task_type: [qa, summary] }
        provider: claude-haiku
        fallback: [claude-sonnet]
        reason: "Haiku optimal for low-complexity tasks (70% cost savings)"

      - id: standard-tasks
        name: "Standard Analysis & Coding"
        enabled: true
        priority: 20
        match: { task_complexity: medium }
        provider: claude-sonnet
        fallback: [claude-opus]
        reason: "Sonnet balanced for medium complexity"

      - id: critical-tasks
        name: "Security & Critical Analysis"
        enabled: true
        priority: 5
        match: { priority: critical, task_type: [security, audit] }
        provider: claude-opus
        fallback: []
        reason: "Opus required for critical decisions"

      - id: default
        name: "Default Rule"
        enabled: true
        priority: 100
        match: {}
        provider: claude-sonnet
        reason: "Balanced default routing"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: increadible
  namespace: increadible
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: increadible
      environment: production

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: increadible
  namespace: increadible
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: increadible
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
